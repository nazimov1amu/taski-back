services:
  postgres:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - taski_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      args:
        SERVICE: backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      ADDRESS: ":8080"
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    build:
      context: .
      args:
        SERVICE: mcp
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      ADDRESS: ":8081"
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  taski_data:
